[project]
name = "hexlet-code"
version = "0.1.0"
description = "Compares two configuration files and shows a difference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"tests/**" = ["assert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gendiff"]

[tool.coverage.report]
fail_under = 70
show_missing = true